# tornadoAgent 前置 Nginx：静态托管 Vue dist + /api 同源反向代理 + SSE 流式专用通道
# 前端 API_BASE='/api' 走同源，浏览器不直连后端 8080。
# 关键约束：chat 的 stream 与 hitl/resume 都是 text/event-stream（POST），必须关缓冲 + 长超时；
#           RAG 文档上传可达 20MB，需放开 client_max_body_size（默认 1m 会 413）。

upstream saa_app {
  server app:8080;      # compose 服务名 app；nginx 启动时经 Docker DNS 解析
  keepalive 64;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # RAG 上传 20MB + 余量；全局放开
  client_max_body_size 25m;

  # gzip 静态资源；显式不含 text/event-stream（见 SSE location 里再关一次）
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # ---------- SPA 静态 ----------
  location / {
    try_files $uri $uri/ /index.html;
  }
  # 带 hash 的构建产物长缓存
  location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  # 入口文件不缓存，保证发版即时生效
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # ---------- SSE：聊天主流 ----------
  location = /api/chat/stream {
    proxy_pass http://saa_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    gzip off;
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    add_header X-Accel-Buffering "no";
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  # ---------- SSE：HITL 决策续流 /api/chat/hitl/{threadId}/resume ----------
  location ~ ^/api/chat/hitl/[^/]+/resume$ {
    proxy_pass http://saa_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    gzip off;
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    add_header X-Accel-Buffering "no";
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  # ---------- 其余 API 反向代理 ----------
  location /api/ {
    proxy_pass http://saa_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";          # 配合 upstream keepalive
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;                  # 普通 JSON 接口
    proxy_send_timeout 120s;
  }

  # Nginx 自身存活探针（后端就绪由 server 镜像 HEALTHCHECK 负责）
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
}
