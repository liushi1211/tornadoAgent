upstream saa_app { server app:8080; keepalive 64; }
server {
  listen 80;
  root /usr/share/nginx/html;
  gzip on; gzip_types text/css application/javascript application/json text/event-stream;
  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(js|css|woff2|png)$ { expires 30d; add_header Cache-Control "public, immutable"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location /api/chat/stream {                    # SSE 专用
    proxy_pass http://saa_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off; proxy_cache off;
    proxy_read_timeout 300s; proxy_send_timeout 300s;
    chunked_transfer_encoding on;
  }
  location /api/ { proxy_pass http://saa_app; proxy_set_header Host $host;
                   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
}
