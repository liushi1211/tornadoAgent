services:
  web:
    build: ./web
    image: tornado/web:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "8085:80"          # 浏览器入口：http://localhost:8085
    depends_on:
      app:
        condition: service_healthy
  app:
    build: ./server
    image: tornado/server:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:mysql://host.docker.internal:3306/cloud_ai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      REDIS_HOST: host.docker.internal
      REDIS_PORT: "6379"
      # 共享 Elasticsearch（独立 elastic 栈，经宿主机端口访问；不与本应用耦合）
      ES_URIS: http://host.docker.internal:9200
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 容器内经此访问宿主 MySQL / Redis / Nacos / ES
    expose:
      - "8080"

  # 说明：MySQL / Redis / Nacos / xxl-job 沿用宿主机部署；
  # Elasticsearch+Kibana 在独立栈 D:\workspace\infra-shared\elastic（项目名 elastic）；
  # Canal(CDC) 在独立栈 D:\workspace\infra-shared\canal（项目名 canal），本应用不再包含。
