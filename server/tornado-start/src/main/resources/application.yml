server:
  port: 8080

app:
  name: tornado-agent-boot

spring:
  autoconfigure:
    exclude: org.springframework.ai.vectorstore.redis.autoconfigure.RedisVectorStoreAutoConfiguration
  application:
    name: tornado-agent
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: ${DB_URL:jdbc:mysql://localhost:3306/cloud_ai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 10000
      # 空闲连接回收与保活
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      keep-alive: true
      # 监控过滤器由下方 filter.*.enabled 声明（druid-spring-boot-starter 机制，勿再手工配 filters 列表，否则细粒度配置不生效）
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: ${DRUID_USER:admin}
        login-password: ${DRUID_PASS:admin123}
        reset-enable: false
      web-stat-filter:
        enabled: true
        url-pattern: "/*"
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      filter:
        stat:
          enabled: true
          slow-sql-millis: 100
          log-slow-sql: true
          db-type: mysql
        slf4j:
          enabled: true
          statement-executable-sql-log-enable: true
  data:
    redis:
      client-type: jedis
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    connection-timeout: 5s
    socket-timeout: 30s
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: "sping-ai-alibaba"
  config:
    import:
      - nacos:chat-models.json?group=DEFAULT_GROUP&refreshEnabled=true

# OpenAI starter 自动配置的占位（业务实际使用 ChatModelFactory 编程式实例）
spring.ai:
  openai:
    api-key: ${SAA_KEY_OPENAI:sk-placeholder-unused}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

saa:
  log:
    llm-context: true   # true=每次模型调用把完整上下文（System/消息/工具）打 INFO 日志；false 降级到 DEBUG
  jwt:
    secret: ${SAA_JWT_SECRET:tornado-dev-jwt-secret-please-change-0123456789abcdef}
    access-ttl-minutes: 120
    refresh-ttl-days: 7
  embedding:
    base-url: https://dashscope.aliyuncs.com/compatible-mode
    api-key: ${SAA_KEY_DASHSCOPE:${AI_DASHSCOPE_API_KEY:}}
    model: text-embedding-v4
    dimensions: 1024
  rag:
    upload-dir: ${RAG_UPLOAD_DIR:./data/rag-files}
    redis-host: ${REDIS_HOST:localhost}
    redis-port: ${REDIS_PORT:6379}
    redis-password: ${REDIS_PASSWORD:}
    index-name: saa_rag_idx
    prefix: rag:doc
    chunk-chars: 1600
    chunk-overlap: 200
    topk: 20
    rerank-enabled: false
    max-file-size-mb: 20
  hitl:
    enabled: true
  canal:
    enabled: ${CANAL_ENABLED:true}   # 打开后应用内嵌 canal 消费者订阅 canal-server → 写 ES
    host: ${CANAL_HOST:localhost}
    port: ${CANAL_PORT:11111}
    destination: example
    filter: "cloud_ai\\.chat_message"
    batch-size: 100
  memory:
    window: 20
    inject-topk: 8
    longterm-model: qwen-turbo

xxl:
  job:
    access-token: ${XXL_JOB_ACCESS_TOKEN:default_token}   # 必须与调度中心一致；xxl-job 3.x 镜像默认 default_token
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDR:http://localhost:12982}   # 必须带 http:// 协议头，否则报 unknown protocol: localhost
    executor:
      ip:                              # 留空自动获取 IP
      port: 9999                       # 执行器端口

logging:
  level:
    com.tornado: info
  file:
    name: logs/saas-server.log
  logback:
    rollingpolicy:
      file-name-pattern: logs/saas-server-%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 200MB
